openapi: 3.1.0
info:
  title: RailDock API
  version: main-2026-09-19
  description: HTTP API for the RailDock control plane. This reference is derived from the public main-branch Rails
    routes and controller behavior researched on 2026-09-19. The repository does not currently ship a canonical
    OpenAPI document, so request/response schemas that are not explicit in controller code are intentionally permissive.
    Validate strict SDK models against the RailDock release you deploy.
  license:
    name: MIT
    identifier: MIT
externalDocs:
  description: RailDock project source
  url: https://github.com/mona-chen/raildock
servers:
- url: /api
  description: Same-origin RailDock control plane
- url: http://localhost:8888/api
  description: Local/default installation
tags:
- name: Health
  description: Control-plane health and bootstrap state.
- name: Auth
  description: User authentication and current-user identity.
- name: Webhooks
  description: Inbound deployment and integration callbacks.
- name: Projects
  description: Project lifecycle and project-wide operations.
- name: Environments
  description: Project environment lifecycle and synchronization.
- name: Manifests
  description: Declarative desired-state documents, previews, apply jobs and drift.
- name: Services
  description: Application and datastore service lifecycle.
- name: Deployments
  description: Deployment history, state and cancellation.
- name: Configuration
  description: Environment variables, domains, storage and service configuration.
- name: Databases
  description: Database metadata and read-only data browsing.
- name: Recovery
  description: Backups, schedules, destinations, snapshots, PITR and recovery drills.
- name: Servers
  description: Deployment target creation, provisioning, validation, metrics and imports.
- name: Organizations
  description: Organization lifecycle and shared operational resources.
- name: Members
  description: Organization membership and invitation workflows.
- name: Git Sources
  description: Repository integrations and source discovery.
- name: Deploy Keys
  description: Automation/deployment credentials.
- name: Templates
  description: Application templates and template deployment.
- name: Activity
  description: Project and organization activity history.
- name: Modules
  description: Installable RailDock modules/plugins.
- name: Admin
  description: Administrative configuration, data safety and updates.
- name: GitHub App
  description: GitHub App manifest, installation and webhook lifecycle.
