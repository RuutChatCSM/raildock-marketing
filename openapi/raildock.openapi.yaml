components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT returned by POST /login.
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required:
      - error
    Health:
      type: object
      properties:
        status:
          type: string
          example: ok
        time:
          type: string
          format: date-time
      required:
      - status
      - time
    User:
      type: object
      additionalProperties: true
      properties:
        id:
          type:
          - integer
          - string
        email:
          type: string
          format: email
        name:
          type:
          - string
          - 'null'
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    LoginResponse:
      type: object
      required:
      - token
      - user
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'
    Project:
      type: object
      additionalProperties: true
      properties:
        id:
          type:
          - integer
          - string
        name:
          type: string
        server_id:
          type:
          - integer
          - string
          - 'null'
        organization_id:
          type:
          - integer
          - string
          - 'null'
    Environment:
      type: object
      additionalProperties: true
      properties:
        id:
          type:
          - integer
          - string
        name:
          type: string
        project_id:
          type:
          - integer
          - string
    Service:
      type: object
      additionalProperties: true
      properties:
        id:
          type:
          - integer
          - string
        name:
          type: string
        service_type:
          type:
          - string
          - 'null'
        subtype:
          type:
          - string
          - 'null'
        status:
          type:
          - string
          - 'null'
        builder:
          type:
          - string
          - 'null'
        git_repo:
          type:
          - string
          - 'null'
        branch:
          type:
          - string
          - 'null'
        docker_image:
          type:
          - string
          - 'null'
        port:
          type:
          - integer
          - string
          - 'null'
        locked:
          type:
          - boolean
          - 'null'
        auto_deploy:
          type:
          - boolean
          - 'null'
        root_directory:
          type:
          - string
          - 'null'
        start_command:
          type:
          - string
          - 'null'
    Server:
      type: object
      additionalProperties: true
      properties:
        id:
          type:
          - integer
          - string
        name:
          type: string
        host:
          type:
          - string
          - 'null'
        status:
          type:
          - string
          - 'null'
        proxy:
          type:
          - string
          - 'null'
        public_ip:
          type:
          - string
          - 'null'
    Organization:
      type: object
      additionalProperties: true
      properties:
        id:
          type:
          - integer
          - string
        name:
          type: string
    Deployment:
      type: object
      additionalProperties: true
      properties:
        id:
          type:
          - integer
          - string
        status:
          type:
          - string
          - 'null'
        service_id:
          type:
          - integer
          - string
        created_at:
          type:
          - string
          - 'null'
          format: date-time
    ManifestDocument:
      type: object
      properties:
        content:
          type: string
        format:
          type: string
        drift:
          type:
          - boolean
          - 'null'
        last_synced_at:
          type:
          - string
          - 'null'
          format: date-time
        last_applied_at:
          type:
          - string
          - 'null'
          format: date-time
      additionalProperties: true
    Backup:
      type: object
      additionalProperties: true
      properties:
        id:
          type:
          - integer
          - string
        status:
          type:
          - string
          - 'null'
        created_at:
          type:
          - string
          - 'null'
          format: date-time
    BackupSchedule:
      type: object
      additionalProperties: true
      properties:
        id:
          type:
          - integer
          - string
        schedule:
          type:
          - string
          - 'null'
        enabled:
          type:
          - boolean
          - 'null'
    ActivityEvent:
      type: object
      additionalProperties: true
      properties:
        id:
          type:
          - integer
          - string
        action:
          type:
          - string
          - 'null'
        created_at:
          type:
          - string
          - 'null'
          format: date-time
    GenericObject:
      type: object
      additionalProperties: true
    GenericList:
      type: array
      items:
        type: object
        additionalProperties: true
    RunCommandRequest:
      type: object
      required:
      - command
      properties:
        command:
          type: string
    DeleteConfirmation:
      type: object
      properties:
        confirmation:
          type: string
          description: Typed confirmation value required by destructive paths.
