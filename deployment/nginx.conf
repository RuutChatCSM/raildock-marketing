server {
    listen 80;
    server_name raildock.example.com;

    # Terminate TLS here or behind your existing edge.
    gzip on;

    location = /docs { return 308 /docs/; }
    location /docs/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /api-reference { return 308 /api-reference/; }
    location /api-reference/ {
        alias /srv/raildock-site/api-reference/dist/;
        try_files $uri $uri/ /api-reference/index.html;
    }

    location / {
        root /srv/raildock-site/marketing;
        try_files $uri $uri/ /404.html;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
